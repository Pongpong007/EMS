<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Google Drive Folder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

    /* Background Image */
    background-image:url("https://www.event-hochiminhcity.com/images/service/DSC_493987.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

/* Dark overlay */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

.container{
    width:90%;
    max-width:500px;
    background:rgba(255,255,255,0.92);
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

h1{
    color:#222;
    margin-bottom:15px;
}

p{
    color:#555;
    font-size:18px;
    margin-bottom:25px;
    line-height:1.5;
}

a{
    display:inline-block;
    padding:15px 30px;
    background:#0F9D58;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

a:hover{
    background:#0B8043;
    transform:scale(1.05);
}
</style>

</head>
<body>

<div class="container">
    <h1>Welcome!</h1>

    <p>
        Click the button below to open my Google Drive folder.
    </p>

    <a href="https://drive.google.com/drive/folders/1dOHKYH0jyfsFOLi0jcpl68ya7BgvjKpf"
       target="_blank">
       📁 Open Google Drive Folder
    </a>

</div>

</body>
</html>
