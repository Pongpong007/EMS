<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Google Drive Folder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

    /* Background Image */
    background:url("https://www.event-hochiminhcity.com/images/service/DSC_493987.jpg") no-repeat center center fixed;
    background-size:cover;
    overflow:hidden;
}

/* Dark Overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:-2;
}

/* Animated Glow */
body::after{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    width:700px;
    height:700px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,
        rgba(255,255,255,.25) 0%,
        rgba(255,255,255,.08) 35%,
        transparent 70%);
    filter:blur(40px);
    animation:pulse 4s infinite ease-in-out;
    z-index:-1;
}

@keyframes pulse{
    0%{
        transform:translate(-50%,-50%) scale(1);
        opacity:.6;
    }
    50%{
        transform:translate(-50%,-50%) scale(1.15);
        opacity:1;
    }
    100%{
        transform:translate(-50%,-50%) scale(1);
        opacity:.6;
    }
}

/* Glass Container */
.container{
    width:90%;
    max-width:500px;
    padding:45px;

    text-align:center;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;

    box-shadow:
        0 0 20px rgba(255,255,255,.35),
        0 0 50px rgba(255,255,255,.20),
        0 0 100px rgba(255,255,255,.10);

    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

h1{
    color:#fff;
    font-size:42px;
    margin-bottom:15px;
    text-shadow:0 0 15px rgba(255,255,255,.9);
}

p{
    color:#f5f5f5;
    font-size:18px;
    line-height:1.6;
    margin-bottom:30px;
    text-shadow:0 0 10px rgba(255,255,255,.6);
}

a{
    display:inline-block;
    padding:15px 35px;
    background:#00c853;
    color:#fff;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    border-radius:50px;

    transition:.3s;

    box-shadow:
        0 0 15px #00c853,
        0 0 30px rgba(0,200,83,.5);
}

a:hover{
    background:#00e676;
    transform:scale(1.08);

    box-shadow:
        0 0 20px #00e676,
        0 0 40px #00e676,
        0 0 60px #00e676;
}

@media(max-width:600px){

    .container{
        width:92%;
        padding:30px;
    }

    h1{
        font-size:32px;
    }

    p{
        font-size:16px;
    }

    a{
        width:100%;
    }

}
</style>

</head>
<body>

<div class="container">

    <h1>Welcome!</h1>

    <p>
        Click the button below to open my Google Drive folder.
    </p>

    <a href="https://drive.google.com/drive/folders/1dOHKYH0jyfsFOLi0jcpl68ya7BgvjKpf" target="_blank">
        📁 Open Google Drive Folder
    </a>

</div>

</body>
</html>
